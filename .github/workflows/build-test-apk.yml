name: Build test APK

# Builds an installable release APK for on-device testing and uploads it as a
# downloadable artifact. Runs on pushes to the fix branch or manually.
on:
  push:
    branches: [fix/harmonyos-pip-install]
  workflow_dispatch:

jobs:
  build-apk:
    name: APK (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10: official Chaquopy SciPy / scikit-learn wheels (old versions)
        # 3.13: Android wheels on PyPI + maintainer's unofficial SciPy wheels
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'

      - name: Install Android NDK (with retries)
        run: |
          NDK=28.2.13676358
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3 4 5; do
            rm -rf "$ANDROID_HOME/ndk/$NDK" "$ANDROID_HOME/.temp"
            if yes | "$SDKM" --install "ndk;$NDK"; then
              if [ -f "$ANDROID_HOME/ndk/$NDK/source.properties" ]; then
                echo "NDK $NDK installed"; exit 0
              fi
            fi
            echo "NDK install attempt $i failed, retrying..."; sleep $((i*10))
          done
          echo "NDK install failed after retries"; exit 1

      - name: Use Python ${{ matrix.python }} in the Chaquopy build (CI only)
        run: |
          sed -i 's/version "3.11"/version "${{ matrix.python }}"/' android/app/build.gradle
          # Chaquopy's Python 3.13+ has no armeabi-v7a build: keep 64-bit ABIs only
          if [ "${{ matrix.python }}" = "3.13" ]; then
            sed -i 's/abiFilters "arm64-v8a", "armeabi-v7a"/abiFilters "arm64-v8a"/' android/app/build.gradle
            grep -n abiFilters android/app/build.gradle
          fi

      - run: flutter pub get

      - name: Create test signing key
        run: |
          keytool -genkeypair \
            -keystore android/ci-release.jks \
            -storepass ci-release-pass \
            -keypass ci-release-pass \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CI,O=Python Runner,C=CN"
          {
            echo "PYRUNNER_RELEASE_STORE_FILE=ci-release.jks"
            echo "PYRUNNER_RELEASE_STORE_PASSWORD=ci-release-pass"
            echo "PYRUNNER_RELEASE_KEY_ALIAS=ci-release"
            echo "PYRUNNER_RELEASE_KEY_PASSWORD=ci-release-pass"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          EXTRA=""
          if [ "${{ matrix.python }}" = "3.13" ]; then EXTRA="--target-platform android-arm64"; fi
          flutter build apk --release $EXTRA || { echo "Build failed, retrying once..."; flutter build apk --release $EXTRA; }

      - uses: actions/upload-artifact@v4
        with:
          name: python-runner-test-apk-py${{ matrix.python }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
