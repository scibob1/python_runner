name: Build test APK

# Builds an installable release APK for on-device testing and uploads it as a
# downloadable artifact. Runs on pushes to the fix branch or manually.
on:
  push:
    branches: [fix/harmonyos-pip-install]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'

      - run: flutter pub get

      - name: Create test signing key
        run: |
          keytool -genkeypair \
            -keystore android/ci-release.jks \
            -storepass ci-release-pass \
            -keypass ci-release-pass \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CI,O=Python Runner,C=CN"
          {
            echo "PYRUNNER_RELEASE_STORE_FILE=ci-release.jks"
            echo "PYRUNNER_RELEASE_STORE_PASSWORD=ci-release-pass"
            echo "PYRUNNER_RELEASE_KEY_ALIAS=ci-release"
            echo "PYRUNNER_RELEASE_KEY_PASSWORD=ci-release-pass"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: python-runner-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
